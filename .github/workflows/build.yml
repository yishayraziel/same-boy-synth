name: Build Same Boy

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target SameBoy_VST3 SameBoy_AU SameBoy_Standalone -j 4

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target SameBoy_VST3 SameBoy_Standalone -j 4

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          A=build/SameBoy_artefacts/Release
          codesign --force --deep -s - "$A/VST3/Same Boy.vst3"
          codesign --force --deep -s - "$A/AU/Same Boy.component"
          codesign --force --deep -s - "$A/Standalone/Same Boy.app"
          mkdir -p dist/root/Library/Audio/Plug-Ins/VST3 dist/root/Library/Audio/Plug-Ins/Components
          cp -R "$A/VST3/Same Boy.vst3" dist/root/Library/Audio/Plug-Ins/VST3/
          cp -R "$A/AU/Same Boy.component" dist/root/Library/Audio/Plug-Ins/Components/
          pkgbuild --root dist/root --identifier com.yraziel.sameboy.pkg --version 1.0.0 \
                   --install-location / "dist/Same Boy 1.0 Installer.pkg"
          mkdir -p dist/zip
          cp -R "$A/VST3/Same Boy.vst3" "$A/AU/Same Boy.component" "$A/Standalone/Same Boy.app" dist/zip/
          cp "dist/Same Boy 1.0 Installer.pkg" dist/zip/
          cp packaging/README-mac.txt dist/zip/README.txt
          cd dist/zip && ditto -c -k --keepParent . "../SameBoy-mac.zip"
          file "../../$A/VST3/Same Boy.vst3/Contents/MacOS/Same Boy"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $A = "build/SameBoy_artefacts/Release"
          New-Item -ItemType Directory -Force dist/zip | Out-Null
          Copy-Item -Recurse "$A/VST3/Same Boy.vst3" dist/zip/
          Copy-Item "$A/Standalone/Same Boy.exe" dist/zip/
          Copy-Item packaging/README-windows.txt dist/zip/README.txt
          Compress-Archive -Path dist/zip/* -DestinationPath dist/SameBoy-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SameBoy-${{ matrix.name }}
          path: dist/SameBoy-${{ matrix.name }}.zip

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Push builds branch
        run: |
          set -e
          mkdir out && cp art/*.zip out/ && cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Builds for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds
      - name: Update "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest art/*.zip -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Same Boy (latest build)" --notes "Automatic build of ${GITHUB_SHA}. Mac: universal VST3 + AU + .pkg installer. Windows: x64 VST3."
